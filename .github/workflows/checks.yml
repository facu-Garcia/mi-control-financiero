name: Verificación de la PWA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Sintaxis y reglas financieras
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sintaxis de JavaScript
        run: |
          node --check logic.js
          node --check features/finance/insights.js
          node --check features/finance/recurring.js
          node --check features/payroll/payroll.js
          node --check features/payroll/payroll-view.js
          node --check features/cards/billing.js
          node --check features/cards/billing-view.js
          node --check features/cards/credit-row.js
          node --check features/savings/pockets.js
          node --check features/savings/pockets-view.js
          node --check features/accounts/account-page.js
          node --check test-v7.cjs
          node --check test-billing.cjs
          node --check test-payroll.cjs
          node --check features/finance/forms.js
          node --check features/finance/transaction-forms.js
          node --check test-transaction-forms.cjs
          node --check features/dashboard/dashboard.js
          node --check features/ui/account-picker.js
          node --check test-ui-v42.cjs
          node --check test-finance-v4.cjs
          node --check csv.js
          node --check storage.js
          node --check card-designs.js
          node --check card-images.js
          node --check test-cards.cjs
          node --check drive-sync.js
          node --check features/backup/backup-model.js
          node --check test-backup-history.cjs
          node --check app.js
          node --check sw.js
          node --check test-logic.cjs
          node --check test-csv.cjs
          node --check test-drive.cjs
          node --check test-storage.cjs
          node --check test-audit.cjs
      - name: Ejecutar pruebas financieras
        run: |
          node test-logic.cjs
          node test-csv.cjs
          node test-drive.cjs
          node test-backup-history.cjs
          node test-storage.cjs
          node test-audit.cjs
          node test-transaction-forms.cjs
          node test-cards.cjs
          node test-finance-v4.cjs
          node test-billing.cjs
          node test-v7.cjs
          node test-payroll.cjs
          node test-ui-v42.cjs
