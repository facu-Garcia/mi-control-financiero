name: Verificación de la PWA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Sintaxis y reglas financieras
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sintaxis de JavaScript
        run: |
          node --check logic.js
          node --check csv.js
          node --check storage.js
          node --check card-designs.js
          node --check card-images.js
          node --check test-cards.cjs
          node --check drive-sync.js
          node --check app.js
          node --check sw.js
          node --check test-logic.cjs
          node --check test-csv.cjs
          node --check test-drive.cjs
          node --check test-storage.cjs
      - name: Ejecutar pruebas financieras
        run: |
          node test-logic.cjs
          node test-csv.cjs
          node test-drive.cjs
          node test-storage.cjs
          node test-cards.cjs
