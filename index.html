<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101828">
  <meta name="description" content="Control de cuentas, tarjetas, presupuestos y gastos con respaldo local y Google Drive cifrado opcional.">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./assets/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="stylesheet" href="./styles.css?v=0.10.2">
  <link rel="stylesheet" href="./features/planning/planning.css?v=0.10.2">
  <link rel="stylesheet" href="./features/dashboard/dashboard.css?v=0.6.0">
  <link rel="stylesheet" href="./features/payroll/payroll.css?v=0.5.0">
  <link rel="stylesheet" href="./features/cards/billing.css?v=0.7.3">
  <link rel="stylesheet" href="./features/accounts/account-page.css?v=0.7.0">
  <link rel="stylesheet" href="./features/ui/account-picker.css?v=0.4.2">
  <link rel="stylesheet" href="./card-designs.css?v=0.3.1">
  <link rel="stylesheet" href="./cards/banks/inbursa.css?v=0.3.1">
  <link rel="stylesheet" href="./cards/banks/mercado-pago.css?v=0.3.2">
  <link rel="stylesheet" href="./cards/banks/nu.css?v=0.3.2">
  <link rel="stylesheet" href="./cards/banks/bbva.css?v=0.3.2">
  <link rel="stylesheet" href="./cards/banks/revolut.css?v=0.3.1">
  <title>Mi Control Financiero</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brandmark" aria-hidden="true">◈</div>
      <div class="brandtext"><div class="brand">Mi Control <span>Financiero</span></div><div class="tagline">Tus finanzas, en un solo lugar</div></div>
      <span id="cloud-chip" class="cloud-chip" aria-live="polite">☁ Sin conectar</span>
      <button class="iconbtn" id="btn-settings" aria-label="Configuración y respaldos" title="Configuración">⚙</button>
    </header>
    <main id="main" tabindex="-1"></main>
    <button class="fab" id="fab-add" title="Registrar movimiento" aria-label="Registrar movimiento">＋</button>
    <nav class="bottom-nav" aria-label="Navegación principal">
      <button data-page="home" class="nav-item active"><span class="nav-icon">⌂</span><span>Resumen</span></button>
      <button data-page="accounts" class="nav-item"><span class="nav-icon">▤</span><span>Cuentas</span></button>
      <button data-page="movements" class="nav-item"><span class="nav-icon">⇄</span><span>Movimientos</span></button>
      <button data-page="budgets" class="nav-item"><span class="nav-icon">◎</span><span>Límites</span></button>
      <button data-page="reports" class="nav-item"><span class="nav-icon">▥</span><span>Informes</span></button>
    </nav>
  </div>
  <dialog id="modal" class="modal"><div id="modal-inner"></div></dialog>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <input type="file" id="import-accounts-file" accept="text/csv,.csv" hidden>
  <input type="file" id="import-movements-file" accept="text/csv,.csv" hidden>
  <div id="toast" aria-live="polite" role="status"></div>
  <script src="./logic.js?v=0.8.0" defer></script>
  <script src="./csv.js?v=0.8.0" defer></script>
  <script src="./storage.js?v=0.9.2" defer></script>
  <script src="./card-designs.js?v=0.3.2" defer></script>
  <script src="./card-images.js?v=0.3.0" defer></script>
  <script src="./drive-sync.js?v=0.9.0" defer></script>
  <script src="./features/backup/backup-model.js?v=0.9.0" defer></script>
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="./features/finance/insights.js?v=0.7.0" defer></script>
  <script src="./features/finance/recurring.js?v=0.4.0" defer></script>
  <script src="./features/finance/forms.js?v=0.9.2" defer></script>
  <script src="./features/dashboard/dashboard.js?v=0.7.3" defer></script>
  <script src="./features/ui/account-picker.js?v=0.4.2" defer></script>
  <script src="./features/payroll/payroll.js?v=0.5.0" defer></script>
  <script src="./features/payroll/payroll-view.js?v=0.5.0" defer></script>
  <script src="./features/cards/billing.js?v=0.8.1" defer></script>
  <script src="./features/cards/billing-view.js?v=0.7.3" defer></script>
  <script src="./features/savings/pockets.js?v=0.7.1" defer></script>
  <script src="./features/savings/pockets-view.js?v=0.7.0" defer></script>
  <script src="./features/accounts/account-page.js?v=0.8.1" defer></script>
  <script src="./features/cards/credit-row.js?v=0.7.0" defer></script>
  <script src="./features/finance/transaction-forms.js?v=0.9.1" defer></script>
  <script src="./features/planning/planning.js?v=0.10.2" defer></script>
  <script src="./features/planning/planning-view.js?v=0.10.2" defer></script>
  <script src="./app.js?v=0.10.2" defer></script>
</body>
</html>
